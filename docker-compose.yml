services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/minecraft_server_archive
      PORT: 5200
      WHITELISTED_PASSWORD: ${WHITELISTED_PASSWORD:?WHITELISTED_PASSWORD must be set}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET must be set}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be set}
    volumes:
      - type: bind
        source: /root/srv/archive/downloads
        target: /app/downloads
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "5200:5200"
    depends_on:
      - mongo

    networks:
      - default
      - proxy

    labels:
      - "traefik.enable=true"
      - 'traefik.docker.network=proxy'

      - "traefik.http.routers.archive.rule=Host(`archive.wouterk12.com`)"
      - "traefik.http.routers.archive.entrypoints=websecure"
      - "traefik.http.routers.archive.tls.certresolver=letsencrypt"

      - "traefik.http.services.archive.loadbalancer.server.port=5200"

  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

networks:
  proxy:
    external: true
